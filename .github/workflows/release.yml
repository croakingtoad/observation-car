name: Release

on:
  push:
    tags:
      # Plugin version tags, with or without a leading 'v' — normalized by
      # stripping the 'v' in the version-consistency guard below.
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    # Reuse the standard checks (install, build, test) instead of duplicating
    # them here.
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Guard version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/verify-release-consistency.sh "$TAG"

      - name: Verify release assets
        run: |
          set -euo pipefail
          for file in main.js manifest.json styles.css versions.json; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing release asset: ${file}"
              exit 1
            fi
          done
          if [ ! -s main.js ]; then
            echo "::error::main.js is zero bytes; refusing to publish an empty bundle."
            exit 1
          fi
          for file in manifest.json styles.css versions.json; do
            if [ ! -s "$file" ]; then
              echo "::error::${file} is zero bytes; refusing to publish an empty release asset."
              exit 1
            fi
          done
          ls -la main.js manifest.json styles.css versions.json

      - name: Create GitHub release
        # Publishes the four assets individually at the top level — BRAT
        # downloads them by file name, so they must not be zipped or nested.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
