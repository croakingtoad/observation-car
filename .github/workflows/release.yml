name: Release

on:
  push:
    tags:
      # Plugin version tags, with or without a leading 'v' — normalized by
      # stripping the 'v' in the version-consistency guard below.
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    # Reuse the standard checks (install, build, test) instead of duplicating
    # them here.
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Guard version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' is not a plugin version (expected '1.2.3' or 'v1.2.3')."
            exit 1
          fi
          MANIFEST_VERSION="$(jq -er '.version | select(type == "string" and length > 0)' manifest.json)"
          MIN_APP_VERSION="$(jq -er '.minAppVersion | select(type == "string" and length > 0)' manifest.json)"
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::manifest.json version '${MANIFEST_VERSION}' does not match tag '${TAG}' (normalized version '${VERSION}'). Bump manifest.json before tagging, or retag."
            exit 1
          fi
          COUNT_FOR_VERSION="$(jq --arg v "$VERSION" '[to_entries[] | select(.value == $v)] | length' versions.json)"
          if [ "$COUNT_FOR_VERSION" -eq 0 ]; then
            echo "::error::versions.json has no entry for plugin version '${VERSION}'. Add it (keyed by minAppVersion) before tagging."
            exit 1
          fi
          MISMATCHED_KEYS="$(jq -r --arg v "$VERSION" --arg m "$MIN_APP_VERSION" 'to_entries[] | select(.value == $v) | select(.key != $m) | .key' versions.json | tr '\n' ' ')"
          if [ -n "$MISMATCHED_KEYS" ]; then
            echo "::error::versions.json lists version '${VERSION}' under key(s) [${MISMATCHED_KEYS% }] but manifest.json minAppVersion is '${MIN_APP_VERSION}'."
            exit 1
          fi
          echo "Version consistency OK: tag '${TAG}' -> version '${VERSION}', minAppVersion '${MIN_APP_VERSION}'."

      - name: Verify release assets
        run: |
          set -euo pipefail
          for file in main.js manifest.json styles.css versions.json; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing release asset: ${file}"
              exit 1
            fi
          done
          if [ ! -s main.js ]; then
            echo "::error::main.js is zero bytes; refusing to publish an empty bundle."
            exit 1
          fi
          ls -la main.js manifest.json styles.css versions.json

      - name: Create GitHub release
        # Publishes the four assets individually at the top level — BRAT
        # downloads them by file name, so they must not be zipped or nested.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
