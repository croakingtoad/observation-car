name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets other workflows (e.g. the M4 release workflow) reuse these checks
  # instead of duplicating them.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 is the current LTS-track major and the strongest version the
          # locked vitest@4.1.11 accepts (engines: ^20 || ^22 || >=24).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Test
        run: npm test
